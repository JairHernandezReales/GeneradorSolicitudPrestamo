<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Solicitud de Préstamo</title>
    <link rel="stylesheet" href="estilos.css">
    <!-- Fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <!-- Favicon genérico de un documento con signo de pesos -->
    <link rel="icon" href="favicon.png" type="image/png">
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>

<body>
    <!-- Barra superior -->
    <header class="topbar">
        <h1>Gestor de Préstamos</h1>
    </header>

    <div class="main-layout">
        
        <!-- COLUMNA IZQUIERDA: FORMULARIO -->
        <div class="col-formulario">
            <form id="form-container" onsubmit="event.preventDefault();">
                
                <!-- SECCIÓN: DATOS PERSONALES -->
                <div class="tarjeta">
                    <h2 class="tarjeta-titulo">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        Datos del Deudor
                    </h2>
                    
                    <div class="form-row">
                        <div class="form-group flex-2">
                            <label for="cedula">Cédula *</label>
                            <div class="input-con-boton">
                                <input type="text" id="cedula" placeholder="Ej: 10203040" class="numeric-input">
                                <button type="button" onclick="buscarPorCedula()" class="btn-buscar">Buscar</button>
                            </div>
                        </div>
                        <div class="form-group flex-1">
                            <label for="ciudadCedula">Ciudad Expedición</label>
                            <input type="text" id="ciudadCedula" placeholder="Ej: Bogotá">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-2">
                            <label for="direccion">Dirección Residencia</label>
                            <input type="text" id="direccion" placeholder="Ej: Calle 123 #45-67">
                        </div>
                        <div class="form-group flex-1">
                            <label for="telefono">Teléfono</label>
                            <input type="text" id="telefono" placeholder="Ej: 3001234567">
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: DATOS LABORALES -->
                <div class="tarjeta">
                    <h2 class="tarjeta-titulo">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
                        Información Laboral
                    </h2>
                    
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="empresa">Empresa</label>
                            <input type="text" id="empresa" placeholder="Ej: Tech Solutions SAS">
                        </div>
                        <div class="form-group flex-1">
                            <label for="ingresos">Ingresos Mensuales</label>
                            <input type="text" id="ingresos" placeholder="Ej: 2.500.000" class="numeric-input">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="direccionOficina">Dirección de la Oficina</label>
                        <input type="text" id="direccionOficina" placeholder="Ej: Av. Principal #10-20">
                    </div>
                </div>

                <!-- SECCIÓN: DETALLES DEL PRÉSTAMO -->
                <div class="tarjeta">
                    <h2 class="tarjeta-titulo">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
                        Detalles del Préstamo
                    </h2>
                    
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="valorPrestamo">Valor del Préstamo *</label>
                            <input type="text" id="valorPrestamo" placeholder="Ej: 1.000.000" class="numeric-input">
                        </div>
                        <div class="form-group flex-1">
                            <label for="cuotas">Número de Cuotas</label>
                            <input type="number" id="cuotas" placeholder="Ej: 12" min="1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="tasaInteres">Tasa Interés Mensual (%)</label>
                            <input type="number" id="tasaInteres" placeholder="Ej: 3" value="3" step="0.1" min="0" max="100">
                        </div>
                        <div class="form-group flex-1">
                            <label for="tipoCuota">Frecuencia de Cobro</label>
                            <select id="tipoCuota">
                                <option value="" selected disabled>Seleccione...</option>
                                <option value="QUINCENALES">QUINCENALES</option>
                                <option value="MENSUALES">MENSUALES</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="primerVencimiento">Fecha Primer Vencimiento</label>
                        <input type="date" id="primerVencimiento">
                    </div>
                </div>

                <!-- TARJETA DE RESULTADOS -->
                <div class="tarjeta tarjeta-resultados">
                    <div class="resultado-grupo">
                        <span class="resultado-label">Valor de la Cuota</span>
                        <input type="text" id="valorCuota" class="numeric-input resultado-valor" disabled readonly>
                    </div>
                    <div class="resultado-grupo">
                        <span class="resultado-label">Total a Pagar</span>
                        <input type="text" id="totalPagar" class="numeric-input resultado-valor" disabled readonly>
                    </div>
                </div>

                <button type="button" onclick="mostrarVistaPrevia()" class="btn-generar">Generar Solicitud en PDF</button>
            </form>
        </div>

        <!-- COLUMNA DERECHA: VISTA PREVIA -->
        <div class="col-vista-previa" id="preview-container">
            <div class="preview-header">
                <h2>Vista previa del documento</h2>
            </div>
            <div class="preview-body">
                <iframe id="pdf-preview"></iframe>
            </div>
            <div class="preview-footer">
                <button id="download-btn" onclick="descargarPDF()">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    Descargar PDF
                </button>
                <button id="close-preview" onclick="cerrarVistaPrevia()">Cerrar</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
